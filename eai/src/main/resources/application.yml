spring:
  main:
    banner-mode: console
    web-application-type: none
  application:
    name: @project.artifactId@
    group: @project.groupId@
    version: @project.version@
  datasource:
    url:     # Must be configured
    username: # Must be configured
    password:  # Must be configured
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
    schemas: pscdeakte
  web:
    error:
      whitelabel:
        enabled: false

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - sbom
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
    info:
      access: read_only
    prometheus:
      access: read_only
    sbom:
      access: read_only
  info:
    env:
      enabled: true
    camel:
      enabled: false
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: info
    de.muenchen.oss.pscdeakte.configuration.AspectConfiguration: DEBUG
  structured:
    format:
      console: logstash
    json:
      stacktrace:
        root: first
        # default max size of one log line in docker is 16kb - UTF8 ~ 1 Character = 1 Byte
        # therefore limit stack traces to a maximum of 8192 characters (to leave room for the rest of the message)
        max-length: 8192
      add:
        application_name: ${spring.application.name}
        application_group: ${spring.application.group}

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    group: ${spring.application.group}
    description: "@project.description@"
  build:
    java.version: "@java.version@"

dms:
  XAnwendung: "PSCD-eAkte-EAI"
  base-url: # Must be configured
  aktenplannummer: "9512"
  coo-einzelakte: # Must be configured
  coo-km-akte: # Must be configured
  jobposition: "DocumentManager"
  joboe: # Must be configured
  cron: # Must be configured

refarch:
  s3:
    url: https://s3k.muenchen.de:443

s3csv:
  bucket: # Must be configured
  backup-bucket: # Must be configured
  prefix: "BP_Export_"
  delimiter: ";"
  skip-header: false

